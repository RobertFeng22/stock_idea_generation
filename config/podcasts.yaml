# =============================================================================
# Podcast 订阅清单
# =============================================================================
# 每个条目至少提供以下三种之一来定位节目（程序会自动解析出 RSS 地址）：
#   - name:       苹果 Podcast 里的节目名称（程序用 iTunes Search API 查 RSS）
#   - apple_url:  苹果 Podcast 网页/App 的链接（包含 id 即可）
#   - feed_url:   直接给出 RSS 地址（最稳，推荐能拿到就填）
#
# 想新增节目时，照着下面的格式加一条即可。改完提交到仓库就会在下一次每周任务生效。
#
# 小贴士：只填 name 时，第一次运行会在 Actions 日志里打印解析到的 feed_url。
#        建议第一次跑完后，把日志里的 feed_url 回填到对应条目（尤其是下面标了
#        ⚠️ 的同名节目），之后解析更稳、不会偶尔匹配错。
# =============================================================================

podcasts:
  # ---- 📊 市场 / 投资 / 宏观 ----
