  - name: "Masters in Business Bloomberg"
  - name: "Odd Lots"
  - name: "Goldman Sachs Exchanges"          # ⚠️ 同名多，建议回填 feed_url
  - name: "Bold Names Wall Street Journal"   # ⚠️ 同名多，建议回填 feed_url
  - name: "In the Know Bernstein"            # ⚠️ 同名多，建议回填 feed_url
  - name: "Making Sense J.P. Morgan"         # ⚠️ 与 Sam Harris 同名，务必回填 feed_url
  - name: "Big Take Asia"

  # ---- 🤖 AI / 科技趋势 ----
  - name: "AI + a16z"
  - name: "No Priors Artificial Intelligence"
  - name: "The a16z Show"
